# 外卖后端运行配置；密钥和主机覆盖项从 `.env` 读取。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: delivery-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:food_delivery}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:delivery}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      pool-name: delivery-hikari
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
  servlet:
    multipart:
      # 图片上传接口的大小上限，与 storage.minio.max-file-size 保持一致。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    # 返回给浏览器的图片地址，容器部署时可指向公网域名。
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
    access-key: ${MINIO_ROOT_USER:food_delivery}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:food-delivery}
    max-file-size: ${MINIO_MAX_FILE_SIZE:5242880}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
